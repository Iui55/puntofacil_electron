<div class="body-content">
  <!-- LEFT: formulario de venta -->
  <section class="panel left-panel">
    <label class="section-title">Venta No.</label>
    <input id="saleNumber" class="sale-number" type="text" readonly />

    <div class="box sale-items-box">
      <div id="saleItemsList" class="items-list"></div>
    </div>

    <label class="section-title">Total</label>
    <div class="total-row">
      <div class="total-value" id="totalValue">0.00</div>
    </div>

    <div class="bottom-row">
      <div class="campo">
        <label class="small-label">Efectivo</label>
        <input
          id="cashInput"
          class="small-input"
          type="number"
          min="0"
          step="0.01"
          value="0.00"
        />
      </div>

      <div class="campo">
        <label class="small-label">Cambio</label>
        <input
          id="changeInput"
          class="small-input"
          type="text"
          readonly
          value="0.00"
        />
      </div>

      <div class="register-col">
        <button id="registerSale" class="primary-btn">Registrar venta</button>
      </div>
    </div>
  </section>

  <!-- RIGHT: catálogo -->
  <section class="panel right-panel">
    <div class="toolbar">
      <div class="left-toolbar">
        <span class="toolbar-text">Mostrando</span>
        <select id="pageSize" class="select-small">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <span class="toolbar-text">registros</span>
      </div>

      <div class="search-wrapper">
        <div class="search-pill">
          <i class="fa fa-search"></i>
          <input
            id="searchInput"
            class="search-input"
            placeholder="Buscar producto"
          />
          <button
            id="clearSearch"
            class="clear-btn"
            title="Clear"
            aria-label="Clear"
          >
            <i class="fa fa-times"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="box catalog-box">
      <div id="catalogList" class="catalog-list"></div>
    </div>

    <div class="paginator">
      <button id="prevPage" class="page-btn">Anterior</button>
      <div id="pagesContainer" class="pages"></div>
      <button id="nextPage" class="page-btn">Siguiente</button>
    </div>
  </section>
</div>
<script src="saleform.js"></script>
