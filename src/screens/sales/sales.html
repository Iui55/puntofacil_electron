<section class="sales-section">
  <!-- Toolbar superior -->
  <div class="toolbar">
    <!-- Barra de búsqueda -->
    <div class="search-sales" id="searchBarSales"></div>

    <select id="filterOption">
      <option value="today">Hoy</option>
      <option value="yesterday">Ayer</option>
      <option value="week">Esta semana</option>
      <option value="month">Este mes</option>
      <option value="range">Rango de fechas</option>
    </select>

    <div id="rangePicker" class="search-pill">
      <i class="fa fa-calendar-o" aria-hidden="true"></i>
      <input id="startDate" class="search-input" />
    </div>
    <button id="generateReportBtn" class="primary-btn" style="margin-top: 10px">
      Generar PDF
    </button>
    <!-- Botón registrar venta -->
    <!-- <button id="registerSalesBtn" class="primary-btn">Registrar venta</button> -->

    <!-- Selector de cantidad -->
    <div class="selector-wrapper">
      <span class="toolbar-text">Mostrando</span>
      <select id="pageSize" class="select-small">
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
      <span class="toolbar-text">registros</span>
    </div>
  </div>

  <!-- Tabla de productos -->
  <div id="salesTable" class="table"></div>
</section>
<script src="sales.js"></script>
