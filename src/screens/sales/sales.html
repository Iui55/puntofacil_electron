<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PuntoFácil — Sales</title>

    <!-- Fuente -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome (íconos) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <link rel="stylesheet" href="sales.css" />
  </head>
  <body>
    <div class="window">
      <!-- HEADER -->
      <header class="top-bar">
        <div class="left-section">
          <div class="brand-circle">
            <i class="fa-solid fa-cash-register"></i>
          </div>
          <span class="brand-text">PuntoFácil</span>
        </div>

        <nav class="center-section">
          <button class="nav-btn">Products</button>
          <div class="divider"></div>
          <button class="nav-btn active">Sales</button>
        </nav>

        <div class="right-section">
          <i class="fa-solid fa-user user-icon"></i>
          <button class="user-btn" id="userBtn">Usuario</button>
        </div>
      </header>

      <!-- BODY -->
      <main class="body-content">
        <!-- LEFT: formulario de venta -->
        <section class="panel left-panel">
          <label class="section-title">Sale No.</label>
          <input id="saleNumber" class="sale-number" type="text" readonly />

          <div class="box sale-items-box">
            <div id="saleItemsList" class="items-list"></div>
          </div>

          <label class="section-title">Total</label>
          <div class="total-row">
            <div class="total-value" id="totalValue">0.00</div>
          </div>

          <div class="bottom-row">
            <div class="campo">
              <label class="small-label">Cash</label>
              <input
                id="cashInput"
                class="small-input"
                type="number"
                min="0"
                step="0.01"
                value="0.00"
              />
            </div>

            <div class="campo">
              <label class="small-label">Change</label>
              <input
                id="changeInput"
                class="small-input"
                type="text"
                readonly
                value="0.00"
              />
            </div>

            <div class="register-col">
              <button id="registerSale" class="primary-btn">
                Register Sale
              </button>
            </div>
          </div>
        </section>

        <!-- RIGHT: catálogo -->
        <section class="panel right-panel">
          <div class="toolbar">
            <div class="left-toolbar">
              <span class="toolbar-text">Showing</span>
              <select id="pageSize" class="select-small">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
              <span class="toolbar-text">records</span>
            </div>

            <div class="search-wrapper">
              <div class="search-pill">
                <i class="fa fa-search"></i>
                <input
                  id="searchInput"
                  class="search-input"
                  placeholder="Search product"
                />
                <button
                  id="clearSearch"
                  class="clear-btn"
                  title="Clear"
                  aria-label="Clear"
                >
                  <i class="fa fa-times"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="box catalog-box">
            <div id="catalogList" class="catalog-list"></div>
          </div>

          <div class="paginator">
            <button id="prevPage" class="page-btn">Previous</button>
            <div id="pagesContainer" class="pages"></div>
            <button id="nextPage" class="page-btn">Next</button>
          </div>
        </section>
      </main>
    </div>

    <script src="js/sales.js"></script>
  </body>
</html>
