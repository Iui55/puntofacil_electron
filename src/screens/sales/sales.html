<div class="body-content">
  <section class="sales-section">
    <!-- Toolbar superior -->
    <div class="toolbar">
      <!-- Barra de búsqueda -->
      <div class="search-sales" id="searchBarSales"></div>

      <!-- Botón registrar venta -->
      <button id="registerSalesBtn" class="primary-btn">Registrar venta</button>

      <!-- Selector de cantidad -->
      <div class="records-wrapper">
        <span class="toolbar-text">Mostrando</span>
        <select id="pageSize" class="select-small">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <span class="toolbar-text">registros</span>
      </div>
    </div>

    <!-- Tabla de productos -->
    <div id="salesTable"></div>

    <!-- Paginación -->
    <div class="paginator">
      <button id="prevPage" class="page-btn">Anterior</button>
      <div id="pagesContainer" class="pages">
        <button class="page-number active">1</button>
        <button class="page-number">2</button>
        <button class="page-number">3</button>
        <button class="page-number">4</button>
      </div>
      <button id="nextPage" class="page-btn">Siguiente</button>
    </div>
  </section>
</div>
<script src="sales.js"></script>
