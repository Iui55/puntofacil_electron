<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar Producto</title>
    <link rel="stylesheet" href="product-add.css" />
  </head>
  <body>
    <div class="header"></div>

    <div class="form-container">
      <div class="form-group">
        <label for="nombre">Nombre del producto</label>
        <input type="text" id="nombre" placeholder="Ej. Refresco 600ml" />
      </div>

      <div class="form-group">
        <label for="precio-compra">Precio de Compra</label>
        <input type="number" id="precio-compra" placeholder="Ej. 12.50" />
      </div>

      <div class="form-group">
        <label for="codigo-barras">Código de barras</label>
        <input type="text" id="codigo-barras" placeholder="Ej. 0987654321" />
      </div>

      <div class="form-group">
        <label for="precio-venta">Precio de Venta</label>
        <input type="number" id="precio-venta" placeholder="Ej. 22.50" />
      </div>

      <div class="form-group">
        <label for="stock-minimo">Stock mínimo</label>
        <input type="number" id="stock-minimo" placeholder="Ej. 5" />
      </div>

      <div class="form-group">
        <label for="cantidad">Cantidad</label>
        <select id="cantidad">
          <option value="0">0</option>
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="30">30</option>
        </select>
      </div>
    </div>

    <div class="footer-buttons">
      <button class="btn-back" id="btn-back">Volver</button>
      <button class="btn-save" id="btn-save">Registrar producto</button>
    </div>

    <script src="product-add.js"></script>
  </body>
</html>
