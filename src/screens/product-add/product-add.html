<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar Producto</title>
    <link rel="stylesheet" href="product-add.css" />
  </head>
  <body>
    <div class="header"></div>

    <form id="productForm" class="form-container">
      <div class="form-group">
        <label for="name">Nombre del producto</label>
        <input type="text" name="name" placeholder="Ej. Refresco 600ml" />
      </div>

      <div class="form-group">
        <label for="cost">Precio de Compra</label>
        <input type="number" name="cost" placeholder="Ej. 12.50" />
      </div>

      <div class="form-group">
        <label for="id">Código de barras</label>
        <input type="text" name="id" placeholder="Ej. 0987654321" />
      </div>

      <div class="form-group">
        <label for="price">Precio de Venta</label>
        <input type="number" name="price" placeholder="Ej. 22.50" />
      </div>

      <div class="form-group">
        <label for="minStock">Stock mínimo</label>
        <input type="number" name="min_stock" placeholder="Ej. 5" />
      </div>

      <div class="form-group">
        <label for="stock">Cantidad</label>
        <input type="number" name="stock" placeholder="Ej. 5" />
      </div>

      <div class="footer-buttons">
        <button type="button" class="btn-back" id="btn-back">Volver</button>
        <button type="submit" class="btn-save" id="btn-save">
          Registrar
        </button>
      </div>
    </form>

    <script src="product-add.js"></script>
  </body>
</html>
